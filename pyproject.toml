[project]
name = "evo-ms-clustering"
version = "0.0.0"
description = "Reproducible Stage 1-3 evolutionary software clustering experiments"
requires-python = ">=3.13,<3.14"
dependencies = [
    "igraph==1.0.0",
    "leidenalg==0.12.0",
    "matplotlib==3.10.8",
    "networkx==3.6.1",
    "numpy==2.4.4",
    "pandas==2.2.3",
    "pymoo==0.6.2",
    "pyyaml==6.0.3",
    "scikit-learn==1.9.0",
    "scipy==1.16.3",
    "sentence-transformers==5.6.0",
    "torch==2.13.0",
    "transformers==5.14.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

