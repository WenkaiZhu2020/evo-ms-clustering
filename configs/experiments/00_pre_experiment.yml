experiment_name: 00_pre_experiment
description: Compare G_raw and G_ssa class dependency graphs.
subjects:
  - jpetstore
  - acmeair
raw_graph:
  graph_name: G_raw
  enabled: true
  include_type_dependencies: true
  include_call_dependencies: true
  weight_formula: raw_weight = type_weight + call_weight
ssa_graph:
  graph_name: G_ssa
  enabled: true
  include_raw_dependencies: true
  include_ssa_flow_dependencies: true
  weight_formula: G_ssa_weight = raw_weight + ssa_flow_weight
ssa_flow_evidence_weights:
  return_value_flow: 3
  argument_passing_flow: 3
leiden:
  resolution: null
output_directory: results
