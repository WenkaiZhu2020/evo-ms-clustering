# Stage 0 — Validation Subject Source Lock
#
# Single source of truth for (1) the three authoritative dissertation
# pipeline branches/SHAs and (2) the exact external source versions for
# the two active additional validation subjects (JFreeChart, EasyMock).
# ArgoUML and Weka were prior large candidates; both are preserved below as
# rejected-candidate provenance records (see rejected_validation_candidates).
#
# Location note: the repository's established configuration convention is
# `configs/` (plural) with `configs/subjects/*.yml` per-project configs and
# `configs/reproducibility/` for environment/reproducibility metadata
# (see configs/reproducibility/environments.json). This file follows that
# convention rather than the literal `config/validation_subjects.lock.yaml`
# path, since a top-level singular `config/` directory does not exist in
# this repository.
#
# Generated: 2026-08-07 (Stage 0 task, read-only w.r.t. experimental code).
# Updated: 2026-08-07 (Stage 0F task) — active large subject replaced
# ArgoUML 0.34 -> Weka 3.8.6 after ArgoUML failed the Stage 1A build smoke
# test (legacy build-file incompatibilities, not a methodology/size issue).
# Updated: 2026-08-07 (Stage 0G / Stage 1A-DUAL task) — active large subject
# replaced Weka 3.8.6 -> JFreeChart 1.0.19. Weka was technically valid and
# successfully extracted (3427 retained classes) but was ~4.2x the size of
# the Xerces-J reference (814 retained classes), which does not serve the
# teacher's matched-scale validation question. JFreeChart (635 retained
# classes) and Apache Ant 1.9.3 (1199 retained classes) were both fetched,
# built, boundary-established, and Soot/Shimple-extracted using the
# unmodified Stage 1 pipeline; JFreeChart was selected for having the
# smaller absolute retained-class distance from Xerces-J (179 vs. 385).

pipeline:
  stage1:
    branch: stage1-baseline
    commit_sha: 0f2591e84db4861af5461e0eeb7e67bc038c2468

  stage2:
    branch: stage2-nsga
    commit_sha: ec7de9560c0543978372c0e7ac094b89f1617ffa

  stage3:
    branch: stage3-Declaration+Method-Body
    commit_sha: df04395e2c6a0555eaf6651efd25698fb7eaa280

  current_final_branch: stage3-Declaration+Method-Body

validation_subjects:
  large:
    system: JFreeChart
    role: additional_large_validation
    canonical_repository: https://github.com/jfree/jfreechart.git
    selected_release: "1.0.19"
    selected_tag: v1.0.19
    commit_sha: b3f5f21ba0fe32a8f7eccb6760a79df30628be3e
    commit_date: "2014-07-31T12:32:18+00:00"
    commit_subject: "Exclude demo files from Maven build."
    checkout_state: detached HEAD at tag v1.0.19
    local_source_path: ../validation-subjects/jfreechart
    build_system: "Maven (single module, pom.xml; sourceDirectory=source, testSourceDirectory=tests; project.source.level/project.target.level=1.6 overridable via -D)"
    retained_application_classes: 635
    scale_distance_from_xerces_j: 179
    selection_reason: >-
      Weka 3.8.6 (the prior large candidate) was technically valid and
      successfully extracted (3427 retained classes) but was rejected as
      the matched-scale subject because it was ~4.2x the size of the
      Xerces-J reference (814 retained classes; see
      rejected_validation_candidates.large). The teacher's validation goal
      requires a subject of approximately the same scale as Xerces-J, not
      merely a technically-valid large subject. Two scale-matched
      candidates were fetched, built, boundary-established, and
      Soot/Shimple-extracted using the unmodified Stage 1 pipeline:
      JFreeChart 1.0.19 (635 retained classes, distance 179 from 814) and
      Apache Ant 1.9.3 (1199 retained classes, distance 385 from 814).
      Both built cleanly using command-line compiler-property overrides
      only (no source/build-file modification, the same pattern already
      used for Xerces-J's own prepare script), and both extracted with
      zero hard failures and non-degenerate graphs. JFreeChart was
      selected because it has the smaller absolute retained-class
      distance from Xerces-J's 814, per the matched-scale selection rule.
      github.com/jfree/jfreechart is the JFree-organization-owned
      canonical repository (not a fork or mirror).

  small:
    system: EasyMock
    role: additional_small_validation
    canonical_repository: https://github.com/easymock/easymock.git
    selected_release: "5.6.0"
    selected_tag: easymock-5.6.0
    commit_sha: 20948ef80f4b2f364fdc990578706986ec5d08db
    commit_date: "2025-05-17T23:58:43-04:00"
    commit_subject: "Move to version 5.6.0"
    checkout_state: detached HEAD at tag easymock-5.6.0
    local_source_path: ../validation-subjects/easymock
    build_system: "Maven (multi-module, reactor pom.xml); java.version=1.8"
    retained_application_classes: 105
    selection_reason: >-
      No specific EasyMock version could be reliably traced to established
      clustering/remodularization literature. Per the version-selection
      priority order, the latest clearly tagged stable release was chosen
      as a defensible, reproducible experimental identity rather than an
      unpinned branch. This is a substantially newer codebase than the
      small (~2001-era) EasyMock versions sometimes referenced informally
      in older literature; see report section 3 for the explicit caveat.

