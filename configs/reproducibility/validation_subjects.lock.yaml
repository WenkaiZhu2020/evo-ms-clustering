run_policy:
  primary_subjects:
    - JPetStore
    - DayTrader
    - Xerces-J

  primary_subject_runs:
    stage2: 30
    stage3: 30

  additional_validation_subjects:
    - EasyMock
    - JFreeChart

  additional_validation_subject_runs:
    stage2: 10
    stage3: 10

  primary_subject_seed_layout:
    # Resolved 2026-08-08 by direct filesystem audit. The Stage 3 primary
    # sample is 30 observations per subject, seeds 0-29, physically split
    # across two directory layers by run.py's output_dir() routing rule
    # (layer = "validation" if seed == 0 else "formal"). Seed 0 is a full
    # production run: completion_status=completed, validation_pass=true, and
    # byte-identical config_sha256 / g_sem_graph_hash to formal seed_01.
    # analyze.py reads seeds 0-29 through run.py's contract, so seed 0 is
    # and always was part of the reported statistics.
    stage2: "robustness_final_30seeds/seed_00..seed_29 (n=30)"
    stage3: "validation/seed_00 + formal/seed_01..seed_29 (n=30)"
    do_not_reduce_to_29: >-
      Published primary results of the form 30/30 are correct. The 2026-08-07
      handoff statement implying n=29 described only the formal/ directory
      layer and was incorrect as a sample size. run_robustness.py's
      FORMAL_SEEDS = range(1, 30) is a wrapper-level constant that was not the
      analysis path for the primary subjects.

lock_policy:
  - These exact external commits are the only versions permitted for the
    dissertation validation experiments unless the lock is explicitly
    revised.
  - All later tasks must read and verify this lock file before building,
    extracting, or running experiments.
  - No automatic pull, branch update, tag change, or source replacement is
    allowed.
  - No later task may infer or substitute a different JFreeChart or
    EasyMock version from memory.
  - If a subject version must change, stop and report the reason before
    modifying this lock.
  - "The three authoritative dissertation stage branches are exactly:
    stage1-baseline, stage2-nsga, stage3-Declaration+Method-Body."
  - No backup, diagnostic, migration, visualisation, main, or superseded
    semantic branch may be treated as authoritative.
  - Experimental class counts must come from our own Soot/preprocessing
    pipeline, not literature-reported counts.
  - Stage 1, Stage 2, and Stage 3 methods and parameters are frozen for the
    additional validation subjects unless explicitly instructed otherwise.
